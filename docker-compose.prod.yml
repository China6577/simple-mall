version: "3.9"

# 生产环境编排：前端为构建后的静态文件镜像，后端使用 Gunicorn，关闭开发热重载。
services:
  mysql:
    image: mysql:8.0
    container_name: mall_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-mall}
      MYSQL_USER: ${DB_USER:-mall_user}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - mall_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: mall_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - mall_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: mall_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    networks:
      - mall_network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mall_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DJANGO_DEBUG: "False"
      SECURE_SSL_REDIRECT: "False"
      DEMO_DATA: ${DEMO_DATA:-0}
    volumes:
      - backend_logs:/app/logs
      - backend_media:/app/media
    networks:
      - mall_network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/')"]
      interval: 15s
      timeout: 5s
      retries: 5

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mall_celery_worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DJANGO_DEBUG: "False"
    volumes:
      - backend_logs:/app/logs
    networks:
      - mall_network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command: ["celery", "-A", "config", "worker", "-l", "info"]

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mall_celery_beat
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DJANGO_DEBUG: "False"
    volumes:
      - backend_logs:/app/logs
    networks:
      - mall_network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command: ["celery", "-A", "config", "beat", "-l", "info"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mall_frontend
    restart: unless-stopped
    networks:
      - mall_network

  nginx:
    image: nginx:alpine
    container_name: mall_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - backend_media:/app/media:ro
      - backend_static:/app/static:ro
    networks:
      - mall_network
    depends_on:
      - backend
      - frontend

volumes:
  mysql_data:
  redis_data:
  backend_logs:
  backend_media:
  backend_static:

networks:
  mall_network:
    driver: bridge

version: "3.9"

services:
  # ---------------------------------------------------------------------------
  # MySQL 8
  # ---------------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: mall_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${DB_NAME:-mall}
      MYSQL_USER: ${DB_USER:-mall_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-mall_password}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - mall_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # Redis 7
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: mall_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - mall_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # RabbitMQ 3（带管理界面）
  # ---------------------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: mall_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - mall_network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # Django 后端（开发模式：自动重载、热更新）
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mall_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DEMO_DATA: ${DEMO_DATA:-0}
    volumes:
      - ./backend:/app
      - ./backend/media:/app/media
      - backend_logs:/app/logs
    ports:
      - "8000:8000"
    networks:
      - mall_network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command: >
      sh -c "python scripts/wait_for_mysql.py &&
             python manage.py migrate --noinput &&
             python scripts/init_admin.py &&
             if [ \"\${DEMO_DATA}\" = \"1\" ]; then python manage.py seed_demo_data || true; fi &&
             python manage.py runserver 0.0.0.0:8000"

  # ---------------------------------------------------------------------------
  # Celery Worker
  # ---------------------------------------------------------------------------
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mall_celery_worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
    volumes:
      - ./backend:/app
      - backend_logs:/app/logs
    networks:
      - mall_network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command: >
      sh -c "celery -A config worker -l info"

  # ---------------------------------------------------------------------------
  # Celery Beat（定时任务调度）
  # ---------------------------------------------------------------------------
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mall_celery_beat
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
    volumes:
      - ./backend:/app
      - backend_logs:/app/logs
    networks:
      - mall_network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command: >
      sh -c "celery -A config beat -l info"

  # ---------------------------------------------------------------------------
  # Vue 前端（开发服务器，HMR 支持）
  # ---------------------------------------------------------------------------
  frontend:
    image: node:20-slim
    container_name: mall_frontend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    networks:
      - mall_network
    command: >
      sh -c "npm install && npm run dev"

  # ---------------------------------------------------------------------------
  # Nginx 反向代理（开发环境统一入口）
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: mall_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - mall_network
    depends_on:
      - backend
      - frontend

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:
  backend_logs:
  backend_media:

networks:
  mall_network:
    driver: bridge
